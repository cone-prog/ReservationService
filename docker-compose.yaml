services:
  reservation-db:
    image: postgres:18
    ports: 
      - "7010:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 20s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: Reservation-db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:  
      - pgdata:/var/lib/postgresql

  reservation-cache-redis:
    image: redis:8
    ports:
      - "7020:6379"
    
  reservation-api:
    build:
      context: ./ReservationService
      dockerfile: dockerfile
    ports:
      - "7000:8080"
    environment:
      ConnectionStrings__PgConnection: ${PG_CONNECTION}
      ConnectionStrings__RedisConnection: ${REDIS_CONNECTION}
    depends_on:
      reservation-db:
        condition: service_healthy
      reservation-cache-redis:
        condition: service_started

volumes:
  pgdata:

     
